version: 0.2

env:
  variables:
    REPOSITORY_URI: 455958489218.dkr.ecr.us-east-1.amazonaws.com/bia

phases:
  pre_build:
    commands:
      - echo Fazendo login no ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 455958489218.dkr.ecr.us-east-1.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - echo "export IMAGE_TAG=${IMAGE_TAG}" > /tmp/env.sh
      - echo "export REPO=${REPOSITORY_URI}" >> /tmp/env.sh
      - echo "PRE_BUILD - IMAGE_TAG=${IMAGE_TAG}"
      - echo "PRE_BUILD - REPOSITORY_URI=${REPOSITORY_URI}"
  build:
    commands:
      - source /tmp/env.sh
      - echo "BUILD - diretorio atual $(pwd)"
      - echo "BUILD - REPO=${REPO}"
      - echo "BUILD - IMAGE_TAG=${IMAGE_TAG}"
      - echo "Gerando imagem da BIA..."
      - docker build -t ${REPO}:latest .
      - echo "docker build OK"
      - docker tag ${REPO}:latest ${REPO}:${IMAGE_TAG}
      - echo "docker tag OK"
      - docker images | grep ${REPO}
  post_build:
    commands:
      - source /tmp/env.sh
      - echo "POST_BUILD - REPO=${REPO}"
      - echo "POST_BUILD - IMAGE_TAG=${IMAGE_TAG}"
      - echo "Fazendo push da imagem para o ECR..."
      - docker push ${REPO}:latest
      - docker push ${REPO}:${IMAGE_TAG}
      - echo "Push OK"
      - printf '[{"name":"bia","imageUri":"%s"}]' ${REPO}:${IMAGE_TAG} > imagedefinitions.json
      - echo "imagedefinitions.json gerado:"
      - cat imagedefinitions.json

artifacts:
  files: imagedefinitions.json
